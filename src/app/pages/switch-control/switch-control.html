<app-control-page [component]="'Switch'">

  <div preview>
    @if (formMode() === 'ngModel') {
      <app-switch
        [ngModel]="reactiveControl.value"
        (ngModelChange)="reactiveControl.setValue($event)"
        [disabled]="reactiveControl.disabled"
      />
    } @else {
      <app-switch
        [formControl]="reactiveControl"
        [disabled]="reactiveControl.disabled"
      />
    }
  </div>

  <app-checkbox
    controls
    label="Ativo / Desativo"
    [isChecked]="reactiveControl.value"
    (isCheckedChange)="reactiveControl.setValue($event)"
  />

  <app-checkbox
    controls
    label="Desabilitado"
    [isChecked]="reactiveControl.disabled"
    (isCheckedChange)="setReactiveDisabled($event)"
  />
</app-control-page>

<section class="container">
  <div class="preview-container">
    <header>
      <h1>Componente Switch</h1>
    </header>
    <div class="preview">
      <app-switch [formControl]="reactiveControl" />
    </div>
  </div>
  <div class="controls-container">
    <h2>Controles</h2>

    <div class="controls">
      <app-checkbox
        label="Ativo / Desativo"
        [isChecked]="reactiveControl.value"
        (isCheckedChange)="reactiveControl.setValue($event)"
      />

      <app-checkbox
        label="Desabilitado"
        [isChecked]="reactiveControl.disabled"
        (isCheckedChange)="setReactiveDisabled($event)"
      />
    </div>
  </div>
</section>

<app-control-page
  [component]="'Switch'"
  [formMode]="formMode()"
  (formModeChange)="formMode.set($event)"
>
  <div preview>
    @if (formMode() === 'ngModel') {
      <app-switch
        [ngModel]="reactiveControl.value"
        (ngModelChange)="reactiveControl.setValue($event)"
        [disabled]="reactiveControl.disabled"
        label="Componente Switch de Demonstração"
        (valueChange)="lastValue.set($event)"
      />
    } @else {
      <app-switch
        [formControl]="reactiveControl"
        label="Componente Switch de Demonstração"
        (valueChange)="lastValue.set($event)"
      />
    }
  </div>

  <p class="actual-value">
    Valor atual: <span>{{ lastValue() === null ? 'false' : lastValue() }}</span>
  </p>
  <app-checkbox
    label="Desabilitado"
    [isChecked]="reactiveControl.disabled"
    (isCheckedChange)="setReactiveDisabled($event)"
  />
</app-control-page>

<div class="select-wrapper" [ngClass]="{ disabled: isDisabled, required: isRequired }">
  <select class="select" [disabled]="isDisabled" [required]="isRequired">
    @if (placeholder) {
      <option value="" disabled selected class="placeholder">
        {{ placeholder }}
      </option>
    }
    @for (option of options; track option) {
      <option [value]="option.value" [disabled]="option.disabled">
        {{ option.label }}
      </option>
    }
  </select>
</div>

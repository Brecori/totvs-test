<div class="select-wrapper" [ngClass]="{ disabled: isDisabled(), error: error() }">
  <select
    #selectElement
    class="select"
    [disabled]="isDisabled()"
    (change)="updateValue(selectElement.value)"
    (blur)="onTouched()"
    [attr.aria-label]="label"
    name="select"
  >
    <option
      value=""
      disabled
      selected
      class="placeholder"
      [hidden]="value() !== ''"
      [selected]="value() === ''"
    >
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
      <option
        [value]="option.value"
        [disabled]="option.disabled"
        [selected]="value() === option.value"
      >
        {{ option.label }}
      </option>
    }
  </select>
</div>

<section class="container">
  <div class="preview-container">
    <header class="preview-header">
      <h2 class="title">Componente {{ component }}</h2>
      <button type="button" class="form-mode-button" (click)="toggleFormMode()">
        Modo: {{ formMode === 'reactive' ? 'Reactive Forms' : 'ngModel' }}
      </button>
    </header>
    <div class="preview">
      <ng-content select="[preview]" />
    </div>
  </div>
  <div class="controls-container">
    <h3 class="controls-title">Controles</h3>

    <div class="controls">
     <ng-content select="[controls]" />
    </div>
  </div>
</section>

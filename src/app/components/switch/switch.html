<label class="switch-container">
  <input
    #checkbox
    type="checkbox"
    class="switch-input"
    role="switch"
    [disabled]="isDisabled()"
    [checked]="isChecked()"
    (change)="updateValue(checkbox.checked)"
    (blur)="onTouched()"
    [attr.aria-label]="label"
  />
  <span class="switch-slider" aria-hidden="true"></span>
</label>

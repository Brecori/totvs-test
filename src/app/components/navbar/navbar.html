<header class="navbar">
  <div class="navbar-container">
    <div class="navbar-menu-container">
      <button
        class="menu-button"
        (click)="onToggleMenu()"
        [ngClass]="{ active: isMenuOpen }"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Menu de Componentes"
        aria-controls="menu-mobile"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <h1 class="title">TOTVS Challenge</h1>
    </div>
    <a
      href="https://github.com/brecori"
      rel="noopener noreferrer"
      target="_blank"
      aria-label="Perfil do Breno Tosi Barros no GitHub"
      class="user-info"
    >
      <img src="https://github.com/brecori.png" alt="Foto de Breno Tosi Barros" />
      <span>Breno Tosi Barros</span>
    </a>
  </div>
</header>
<app-aside-bar
  id="menu-mobile"
  class="menu-container"
  [ngClass]="{ active: isMenuOpen }"
  (linkSelected)="closeMenu()"
  [inert]="!isMenuOpen"
/>

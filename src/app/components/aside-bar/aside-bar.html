<aside class="aside-container">
  <h2 class="aside-title">Componentes</h2>
  <ul class="aside-list">
    @for (link of links; track link) {
      <li class="aside-list-item" routerLinkActive="active">
        <a [routerLink]="link.path" class="aside-list-link">{{ link.label }}</a>
      </li>
    }
  </ul>
</aside>
